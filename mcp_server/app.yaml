# Databricks App config for the weather MCP server.
# Deploy with: databricks apps deploy weather-mcp-server --source-code-path mcp_server
command: ["python", "weather_mcp_server.py"]

env:
  - name: "NWS_USER_AGENT"
    value: "weather-mcp-agent (contact: beesal13dh@gmail.com)"
  # No API key needed for Open-Meteo. If you swap in a keyed weather API later,
  # add it as a Databricks secret and reference it here, e.g.:
  # - name: "WEATHER_API_KEY"
  #   valueFrom: "weather-mcp-secrets/weather_api_key"
